<!DOCTYPE html>
<html>

<head>
  <title>Log In</title>
</head>

<body>
  <div id="boxDiv">
    <h1>Log In</h1>

    <table>
      <tr>
        <td>Username:</td>
        <td><input id="usernameInput" /></td>
      </tr>
      <tr>
        <td>Password:</td>
        <td><input id="passwordInput" type="password" /></td>
      </tr>
    </table>

    <button id="submitButton">Submit</button>
    <button id="LoginReturnButton">Return</button>
    <div id="errorDiv"></div>
  </div>

  <script type="module" src="logIn.js"></script>
</body>

</html>
