<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="popup">
        <h1>Login</h1>

        <form id="loginForm">

    <script type="module" src="login.js"></script>
</body>

</html>
