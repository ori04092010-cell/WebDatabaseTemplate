<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Factory Game</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>

  <div class="game-container">

    <h2 id="welcome">Welcome!</h2>

    <h1 id="cookieCount">Cookies: 0</h1>
    <h3 id="cps">Cookies per second: 0</h3>

    <button id="cookieBtn">
      <img src="cookie.png" alt="cookie" class="cookie-img">
    </button>

    <button id="buyCursor">Buy Cursor (10 cookies)</button>

    <button id="logoutBtn" class="logout">Logout</button>

  </div>

  <script src="game.js"></script>
</body>
</html>
